<section id="su-di-me" class="about-section">
  <div class="about-container">
    
    <!-- Intestazione -->
    <div class="section-header">
      <h2 class="section-title">Su di me</h2>
      <p class="section-subtitle">
        Oltre le righe di codice: curiosità, manualità e passioni a 360 gradi.
      </p>
    </div>

    <!-- Pulsanti delle Schede -->
    <div class="tabs-navigation">
      <button 
        *ngFor="let item of passions" 
        class="tab-btn" 
        [class.active]="activeTab === item.id"
        (click)="selectTab(item.id)">
        <i [ngClass]="item.icon"></i> {{ item.title.split(' ')[0] }}
      </button>
    </div>

    <!-- Contenuto delle Schede -->
    <div class="tabs-content-container">
      <ng-container *ngFor="let item of passions">
        <div class="tab-panel" [class.active]="activeTab === item.id" *ngIf="activeTab === item.id">
          <div class="tab-card-content">
            <div class="tab-icon-large"><i [ngClass]="item.icon"></i></div>
            <div class="tab-text">
              <h3>{{ item.title }}</h3>
              <p>{{ item.description }}</p>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

  </div>
</section>
