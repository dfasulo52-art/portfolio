<!doctype html>
<html lang="ita">
<head>
  <meta charset="utf-8">
  <title>Header</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <app-root></app-root>

  <script>
    // Monitora continuamente il DOM per eliminare il badge non appena compare
    const observer = new MutationObserver((mutations, obs) => {
      const netlifyBadge = document.querySelector('a[href*="netlify.com/internal/link"]');
      const badgeContainer = document.querySelector('div[style*="z-index"][style*="position: fixed"]');

      if (netlifyBadge) {
        const parent = netlifyBadge.closest('div') || netlifyBadge.parentElement;
        if (parent) parent.remove();
        obs.disconnect();
      }
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  </script>
</body>
</html>
